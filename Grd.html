<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>
<h2>Grade Calculator</h2>
    <input type="number" placeholder="Enter Mark 1" id="mark1"><br><br>
    <input type="number" placeholder="Enter Mark 2" id="mark2"><br><br>
    <input type="number" placeholder="Enter Mark 3" id="mark3"><br><br>
    <input type="number" placeholder="Enter Mark 4" id="mark4"><br><br>
    <input type="number" placeholder="Enter Mark 5" id="mark5"><br><br>
    <input type="number" placeholder="Enter Mark 6" id="mark6"><br><br>

    <button onclick="Grade()">Calculate</button>

    <h3 id="result"></h3>

<script>
function Grade() {
    var m1 = Number(document.getElementById("mark1").value);
    var m2 = Number(document.getElementById("mark2").value);
    var m3 = Number(document.getElementById("mark3").value);
    var m4 = Number(document.getElementById("mark4").value);
    var m5 = Number(document.getElementById("mark5").value);
    var m6 = Number(document.getElementById("mark6").value);

        var total = m1 + m2 + m3 + m4 + m5 + m6;
    var avg = total / 6;

    
    var grade = "";
    if (avg >= 90) {
        grade = "A+";
    } else if (avg >= 75) {
        grade = "A";
    } else if (avg >= 50) {
        grade = "B";
    } else {
        grade = "Fail";
    }

    
    document.getElementById("result").innerText = 
        "Total: " + total + " | Average: " + avg.toFixed(2) + " | Grade: " + grade;
}
</script>

</body>
</html>
